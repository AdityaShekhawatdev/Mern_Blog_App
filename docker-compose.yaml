version: '3.8'
services:
 backend:
  build: ./backend
  container_name: blog-backend
  expose:
   - "5001"
  environment:
   - MONGODB_URI=mongodb://mongodb:27017/blog-app
   - PORT=5001
  depends_on:
   - mongodb
  networks:
   - app-network

 frontend:
  build: ./frontend
  container_name: blog_frontend
  expose:
   - "3000"
  depends_on:
   - backend
  networks:
   - app-network

 mongodb:
  image: mongo:7
  volumes:
   - mongo-data:/data/db
  networks:
   - app-network

 nginx:
  image: nginx:alpine
  container_name: nginx
  ports:
   - "80:80"
  volumes:
   - ./nginx.conf:/etc/nginx/nginx.conf
  depends_on:
   - frontend
   - backend
  networks:
   - app-network

networks:
 app-network:
  driver: bridge

volumes:
 mongo-data: