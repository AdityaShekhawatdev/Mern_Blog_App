version: '3.8'

services:
 backend:
  build: ./backend
  container_name: blog-backend
  expose:
   - "5001"
  environment:
   - MONGODB_URI=mongodb://mongodb:27017/blog-app
   - PORT=5001
  depends_on:
   - mongodb

 frontend:
  build: ./frontend
  container_name: blog_frontend
  expose:
  - "3000"
  depends_on:
   - backend

 mongodb:
  image: mongo:7
  ports:
   - "27017:27017"
  volumes:
   - mongo-data:/data/db

 nginx:
  image: nginx:alpine
  container_name: nginx
  ports:
   - "80:80"
  volumes:
   - ./nginx.conf:/etc/nginx/nginx.conf
  depends_on:
   - frontend
   - backend     

volumes:
 mongo-data:   
