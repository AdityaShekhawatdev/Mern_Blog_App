version: '3.8'

services:
  backend:
    build: ./backend
    container_name: blog_backend
    expose:
     - "5001"
    environment:
     MONGODB_URI: mongodb://mongo:27017/blog-app
     PORT: 5001
    depends_on:
      - mongo    
  
  frontend:
    build: ./frontend
    container_name: blog_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
  
  mongo:
    image: mongo:7
    container_name: mongo
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db


volumes:
  mongo_data:  
       
