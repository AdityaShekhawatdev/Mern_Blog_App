version: '3.8'

services:
 backend:
  build: ./backend
  container_name: blog-backend
  ports:
   - "5001:5001"
  environment:
   - MONGO_URI=mongodb://mongodb:27017/blog-app
   - PORT=5001
  depends_on:
   - mongodb

 frontend:
  build: ./frontend
  container_name: blog_frontend
  ports:
  - "3000:3000"
  depends_on:
   - backend

 mongodb:
  image: mongo:7
  ports:
   - "27017:27017"
  volumes:
   - mongo-data:/data/db

volumes:
 mongo-data:   
