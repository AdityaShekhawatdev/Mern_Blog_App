mongodb:
  replicaCount: 1

  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 27017

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"



backend:
  replicaCount: 1

  image:
    repository: shekhawataditya/mern-blog-backend
    tag: "latest"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 5001

  resources:
    requests:
      memory: "128Mi"
      cpu: "125m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  env:
    nodeEnv: production
    port: 5001
    


frontend:
  replicaCount: 1

  image:
    repository: shekhawataditya/mern-blog-frontend
    tag: "latest"
    pullPolicy: Always

  service:
    type: LoadBalancer
    port: 80
    nodePort: 30002

  resources:
    requests:
      memory: "128Mi"
      cpu: "125m"
    limits:
      memory: "256Mi"
      cpu: "250m"


secret:
  MONGODB_URI: "mongodb://mongodb-service:27017/blog-app"     
